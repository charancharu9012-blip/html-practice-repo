<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Forecast</h1>
        <p class="subtitle">Check the current weather anywhere</p>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <!-- Loading -->
        <p id="loading">Loading weather...</p>

        <!-- Error -->
        <p id="error"></p>

        <!-- Current Weather -->
        <div class="weather-card">

            <div class="location">
                <h2 id="city">Bengaluru</h2>
                <p id="date">--</p>
            </div>

            <div class="weather-main">

                <div>
                    <img id="weatherIcon" src="" alt="Weather Icon">
                </div>

                <div>
                    <h2 id="temperature">--°C</h2>
                    <p id="condition">--</p>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail-box">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail-box">
                    <span>🌧️</span>
                    <p>Pressure</p>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>

        </div>

        <!-- Forecast -->
        <h2 class="forecast-title">5-Day Forecast</h2>

        <div id="forecast" class="forecast-container">
            <!-- Forecast cards generated by JavaScript -->
        </div>

        <p class="refresh">
            🔄 Weather automatically refreshes every 20 seconds
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
